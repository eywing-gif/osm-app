<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Spatial Analytics: a heat-map grid (the analysis squares on the map) and a reach ring around a place -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="112" height="112" rx="26"/></clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#tile)" stroke="#0f172a" stroke-width="2">
    <!-- 4 × 4 squares, hottest next to the place (cell 28 px, from 8) -->
    <rect x="8"  y="8"  width="28" height="28" fill="#1e40af"/>
    <rect x="36" y="8"  width="28" height="28" fill="#2f6b8f"/>
    <rect x="64" y="8"  width="28" height="28" fill="#3f8f6b"/>
    <rect x="92" y="8"  width="28" height="28" fill="#2f6b8f"/>
    <rect x="8"  y="36" width="28" height="28" fill="#2f6b8f"/>
    <rect x="36" y="36" width="28" height="28" fill="#c2e699"/>
    <rect x="64" y="36" width="28" height="28" fill="#e3f39a"/>
    <rect x="92" y="36" width="28" height="28" fill="#3f8f6b"/>
    <rect x="8"  y="64" width="28" height="28" fill="#3f8f6b"/>
    <rect x="36" y="64" width="28" height="28" fill="#e3f39a"/>
    <rect x="64" y="64" width="28" height="28" fill="#c2e699"/>
    <rect x="92" y="64" width="28" height="28" fill="#5bb466"/>
    <rect x="8"  y="92" width="28" height="28" fill="#1e40af"/>
    <rect x="36" y="92" width="28" height="28" fill="#3f8f6b"/>
    <rect x="64" y="92" width="28" height="28" fill="#5bb466"/>
    <rect x="92" y="92" width="28" height="28" fill="#2f6b8f"/>
  </g>
  <!-- reach ring and the place -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 7" stroke-linecap="round" opacity=".95"/>
  <circle cx="64" cy="64" r="11" fill="#fff"/>
  <circle cx="64" cy="64" r="5.5" fill="#2563eb"/>
</svg>
